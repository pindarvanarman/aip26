document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ar(--accent)}\nimg{display:block;max-width:100%}\nh1,h2,h3,p,ol,figure{margin:0}\n@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"background:var(--canvas);color:var(--paper);min-height:100vh;overflow-x:hidden\">\n\n<header style=\"position:sticky;top:0;z-index:30;background:rgba(6,6,5,.74);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--rule)\">\n<div style=\"width:min(calc(100% - 48px),1240px);margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:24px;padding:15px 0\">\n<div style=\"font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.2em;font-size:.65rem;color:var(--paper)\">Pindar Van Arman<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fheader>\n\n<main>\n\n<section data-hero=\"1\" style=\"position:relative;overflow:hidden;border-bottom:1px solid var(--rule)\">\n<div data-hero-art=\"1\" data-parallax=\"1\" style=\"position:absolute;top:-4%;bottom:-4%;right:-8%;width:64%;background:url(&quot;51518e11-fac0-4179-9bbe-82e176a81a1c&quot;) right center/contain no-repeat;opacity:.46;-webkit-mask-image:linear-gradient(100deg,transparent 4%,#000 44%,#000 74%,transparent 99%);mask-image:linear-gradient(100deg,transparent 4%,#000 44%,#000 74%,transparent 99%);pointer-events:none\"><\u002Fdiv>\n<div style=\"position:relative;width:min(calc(100% - 48px),1240px);margin:0 auto;padding:clamp(74px,11vw,152px) 0 clamp(54px,7vw,104px)\">\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(38px,6vw,88px);align-items:flex-end\">\n<div style=\"flex:1 1 540px;min-width:0\">\n<div data-reveal=\"1\" data-delay=\"0\" style=\"font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.2em;font-size:.66rem;color:var(--muted);margin-bottom:26px\">AI Portraits · 2017–2024<\u002Fdiv>\n<h1 data-reveal=\"1\" data-delay=\"90\" style=\"font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(4.4rem,13vw,11.5rem);line-height:.82;letter-spacing:-.035em;margin-bottom:38px;max-width:9ch\">AI Portraits<\u002Fh1>\n<p data-reveal=\"1\" data-delay=\"200\" style=\"font-family:'Instrument Serif',Georgia,serif;font-size:clamp(1.4rem,2.5vw,2.1rem);line-height:1.28;letter-spacing:-.01em;color:#d6d2cb;max-width:36ch\">The AI Portraits series consists of four projects that trace Van Arman’s evolving experiments in autonomous machine creativity through a rare, long-running practice of embodied AI. His systems imagine, act, perceive, and respond in the physical world, using the emergence of a face as a threshold between imagination, perception, and recognition.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"projects\">\n\n<article data-reveal=\"1\" style=\"width:min(calc(100% - 48px),1240px);margin:0 auto;padding:clamp(72px,9vw,138px) 0;border-bottom:1px solid var(--rule)\">\n<div style=\"display:flex;align-items:center;gap:20px;margin-bottom:clamp(34px,5vw,58px)\">\n<span style=\"font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.2em;font-size:.66rem;color:var(--accent);white-space:nowrap\">2017 · I<\u002Fspan>\n<span style=\"flex:1;height:1px;background:var(--rule)\"><\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(40px,6vw,96px);align-items:center\">\n<div style=\"flex:1 1 480px;min-width:0\">\n<h2 style=\"font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(3rem,6.2vw,5.8rem);line-height:.92;letter-spacing:-.03em;margin-bottom:12px\">Emerging Faces<\u002Fh2>\n<p style=\"font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:clamp(1.3rem,2.2vw,1.75rem);line-height:1.2;color:var(--accent);margin-bottom:30px\">embodied autonomous creativity<\u002Fp>\n<p style=\"color:var(--wash);max-width:47ch;margin-bottom:6px\">Recognized as the first instance of paintings autonomously created by a robot, this series began with pure experiment. The artist gave his system just two instructions:<\u002Fp>\n<ol style=\"list-style:none;padding:0;margin:26px 0 30px;max-width:47ch;border-top:1px solid var(--rule)\">\n<li style=\"display:grid;grid-template-columns:46px 1fr;gap:14px;align-items:baseline;padding:15px 0;border-bottom:1px solid var(--rule)\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.16em;color:var(--accent)\">01<\u002Fspan><span style=\"font-family:'Instrument Serif',Georgia,serif;font-size:1.28rem;line-height:1.3;color:var(--paper)\">Imagine a human face and paint it on the canvas.<\u002Fspan><\u002Fli>\n<li style=\"display:grid;grid-template-columns:46px 1fr;gap:14px;align-items:baseline;padding:15px 0;border-bottom:1px solid var(--rule)\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.16em;color:var(--accent)\">02<\u002Fspan><span style=\"font-family:'Instrument Serif',Georgia,serif;font-size:1.28rem;line-height:1.3;color:var(--paper)\">Stop as soon as you recognize a face.<\u002Fspan><\u002Fli>\n<\u002Fol>\n<p style=\"color:var(--wash);max-width:47ch;margin-bottom:18px\">This experiment allowed the interaction between GANs, physical paint, robotics and feedback loops to produce artworks that emerged from the system itself. By integrating the paint's chaotic physical inputs into the digital system, Van Arman pushed past the barrier of algorithmic determinism, creating an opening for a truly autonomous process to unfold. What emerged are haunting traces of machine creativity.<\u002Fp>\n<p style=\"color:var(--wash);max-width:47ch\">Only 44 canvases from this period remain.<\u002Fp>\n<\u002Fdiv>\n<figure data-parallax=\"1\" style=\"flex:1 1 400px;min-width:0\">\n<img src=\"51518e11-fac0-4179-9bbe-82e176a81a1c\" alt=\"Emerging Faces artwork by Pindar Van Arman\" style=\"width:100%;max-height:660px;object-fit:contain;border:1px solid #191916\">\n<figcaption style=\"display:flex;justify-content:space-between;gap:16px;padding-top:12px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.16em;font-size:.6rem;color:var(--muted)\"><span>Emerging Faces<\u002Fspan><span>2017<\u002Fspan><\u002Ffigcaption>\n<\u002Ffigure>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article data-reveal=\"1\" style=\"width:min(calc(100% - 48px),1240px);margin:0 auto;padding:clamp(72px,9vw,138px) 0;border-bottom:1px solid var(--rule)\">\n<div style=\"display:flex;align-items:center;gap:20px;margin-bottom:clamp(34px,5vw,58px)\">\n<span style=\"font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.2em;font-size:.66rem;color:var(--accent);white-space:nowrap\">2018 · II<\u002Fspan>\n<span style=\"flex:1;height:1px;background:var(--rule)\"><\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(40px,6vw,96px);align-items:center\">\n<figure data-parallax=\"1\" style=\"flex:1 1 400px;min-width:0;order:-1\">\n<img src=\"69a4af4b-a89f-43d5-abef-7f523d950377\" alt=\"First Sparks artwork by Pindar Van Arman\" style=\"width:100%;max-height:660px;object-fit:contain;border:1px solid #191916\">\n<figcaption style=\"display:flex;justify-content:space-between;gap:16px;padding-top:12px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.16em;font-size:.6rem;color:var(--muted)\"><span>First Sparks<\u002Fspan><span>2018<\u002Fspan><\u002Ffigcaption>\n<\u002Ffigure>\n<div style=\"flex:1 1 460px;min-width:0\">\n<h2 style=\"font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(3rem,6.2vw,5.8rem);line-height:.92;letter-spacing:-.03em;margin-bottom:12px\">First Sparks<\u002Fh2>\n<p style=\"font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:clamp(1.3rem,2.2vw,1.75rem);line-height:1.2;color:var(--accent);margin-bottom:30px\">emergence becomes a language<\u002Fp>\n<p style=\"color:var(--wash);max-width:47ch\">After the initial experiment, Van Arman was commissioned by VIEWS to make 128 paintings for the Tribeca Film Festival in New York. These works represent a formalization of Van Arman's robotic emergence process, and it received first prize in the 2018 International Robot Art Competition.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article data-reveal=\"1\" style=\"width:min(calc(100% - 48px),1240px);margin:0 auto;padding:clamp(72px,9vw,138px) 0;border-bottom:1px solid var(--rule)\">\n<div style=\"display:flex;align-items:center;gap:20px;margin-bottom:clamp(34px,5vw,58px)\">\n<span style=\"font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.2em;font-size:.66rem;color:var(--accent);white-space:nowrap\">2023 · III<\u002Fspan>\n<span style=\"flex:1;height:1px;background:var(--rule)\"><\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(40px,6vw,96px);align-items:center\">\n<div style=\"flex:1 1 460px;min-width:0\">\n<h2 style=\"font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(2.8rem,5.6vw,5.2rem);line-height:.92;letter-spacing:-.03em;margin-bottom:12px\">AI Imagined Faces On-Chain<\u002Fh2>\n<p style=\"font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:clamp(1.3rem,2.2vw,1.75rem);line-height:1.2;color:var(--accent);margin-bottom:30px\">the elegance of constraint<\u002Fp>\n<p style=\"color:var(--wash);max-width:47ch\">This project looks at the atomic elements of emergence in Van Arman's process, translating it into six perceptual fragments that constitute the system's sense of the threshold where a face appears. The technical constraint of on-chain storage refines the execution into a poetic expression of the system's essence.<\u002Fp>\n<\u002Fdiv>\n<figure data-parallax=\"1\" style=\"flex:1 1 400px;min-width:0\">\n<img src=\"06ea232d-5aba-459b-8199-0ead2c9944ef\" alt=\"AI Imagined Faces On-Chain artwork by Pindar Van Arman\" style=\"width:100%;max-height:660px;object-fit:contain;border:1px solid #191916\">\n<figcaption style=\"display:flex;justify-content:space-between;gap:16px;padding-top:12px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.16em;font-size:.6rem;color:var(--muted)\"><span>AI Imagined Faces On-Chain<\u002Fspan><span>2023<\u002Fspan><\u002Ffigcaption>\n<\u002Ffigure>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article data-reveal=\"1\" style=\"width:min(calc(100% - 48px),1240px);margin:0 auto;padding:clamp(72px,9vw,138px) 0;border-bottom:1px solid var(--rule)\">\n<div style=\"display:flex;align-items:center;gap:20px;margin-bottom:clamp(34px,5vw,58px)\">\n<span style=\"font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.2em;font-size:.66rem;color:var(--accent);white-space:nowrap\">2024 · IV<\u002Fspan>\n<span style=\"flex:1;height:1px;background:var(--rule)\"><\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(40px,6vw,96px);align-items:center\">\n<figure data-parallax=\"1\" style=\"flex:1 1 420px;min-width:0;order:-1\">\n<img src=\"bf67c066-a830-46f7-8927-39243150acdd\" alt=\"Reflection artwork by Pindar Van Arman\" style=\"width:100%;max-height:700px;object-fit:contain;border:1px solid #191916\">\n<figcaption style=\"display:flex;justify-content:space-between;gap:16px;padding-top:12px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.16em;font-size:.6rem;color:var(--muted)\"><span>Reflection<\u002Fspan><span>2024<\u002Fspan><\u002Ffigcaption>\n<\u002Ffigure>\n<div style=\"flex:1 1 440px;min-width:0\">\n<h2 style=\"font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(3rem,6.2vw,5.8rem);line-height:.92;letter-spacing:-.03em;margin-bottom:12px\">Reflection<\u002Fh2>\n<p style=\"font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:clamp(1.3rem,2.2vw,1.75rem);line-height:1.2;color:var(--accent);margin-bottom:30px\">the full process goes on chain<\u002Fp>\n<p style=\"color:var(--wash);max-width:47ch\">This series pushes further into the possibilities of blockchain as a medium for novel artistic processes. Here, Van Arman executes his full reflective AI process through actions that take place on chain. Dozens of custom algorithms, as well as inputs taken from the system's physical interactions, are translated to Solidity, the coding language of Ethereum, and combined with seed hashes to allow an emergent process to unfold through 22 layers of randomness. The density of detail in these works derives from the masterful vector construction, a strikingly intricate and vibrant construction.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Farticle>\n\n<\u002Fsection>\n\n<section data-reveal=\"1\" id=\"record\" style=\"width:min(calc(100% - 48px),1240px);margin:0 auto;padding:clamp(80px,10vw,140px) 0 clamp(60px,7vw,96px)\">\n<div style=\"font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.2em;font-size:.66rem;color:var(--muted)\">Institutional record<\u002Fdiv>\n<h2 style=\"font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(2.6rem,5.6vw,5.2rem);line-height:.96;letter-spacing:-.03em;margin:20px 0 clamp(38px,5vw,60px);max-width:16ch\">The work enters the record.<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));border-top:1px solid var(--rule);border-left:1px solid var(--rule)\">\n<div style=\"padding:26px 24px 30px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);min-height:186px\">\n<span style=\"font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.16em;font-size:.58rem;color:var(--muted)\">Permanent collection<\u002Fspan>\n<h3 style=\"font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:1.85rem;line-height:1.05;margin:16px 0 10px\">LACMA<\u002Fh3>\n<p style=\"color:var(--muted);font-size:.9rem;line-height:1.55\">AI Imagined Portrait Painted by a Robot #2 entered the Los Angeles County Museum of Art’s permanent collection in 2023.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding:26px 24px 30px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);min-height:186px\">\n<span style=\"font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.16em;font-size:.58rem;color:var(--muted)\">First prize<\u002Fspan>\n<h3 style=\"font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:1.85rem;line-height:1.05;margin:16px 0 10px\">RobotArt 2018<\u002Fh3>\n<p style=\"color:var(--muted);font-size:.9rem;line-height:1.55\">Van Arman’s AI portrait work took first place in the $100,000 International Robot Art Competition.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding:26px 24px 30px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);min-height:186px\">\n<span style=\"font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.16em;font-size:.58rem;color:var(--muted)\">Augmented Intelligence · 2025<\u002Fspan>\n<h3 style=\"font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:1.85rem;line-height:1.05;margin:16px 0 10px\">Christie’s<\u002Fh3>\n<p style=\"color:var(--muted);font-size:.9rem;line-height:1.55\">Emerging Faces was featured in Christie’s landmark Augmented Intelligence sale, the first major auction-house sale dedicated to AI art.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding:26px 24px 30px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);min-height:186px\">\n<span style=\"font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.16em;font-size:.58rem;color:var(--muted)\">Permanent collection<\u002Fspan>\n<h3 style=\"font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:1.85rem;line-height:1.05;margin:16px 0 10px\">Museum of Art + Light<\u002Fh3>\n<p style=\"color:var(--muted);font-size:.9rem;line-height:1.55\">An original Reflection painting and its corresponding on-chain work entered the museum’s permanent collection.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-reveal=\"1\" id=\"exhibitions\" style=\"width:min(calc(100% - 48px),1240px);margin:0 auto;padding:clamp(60px,7vw,100px) 0 clamp(90px,11vw,150px)\">\n<div style=\"font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.2em;font-size:.66rem;color:var(--muted)\">Exhibition history<\u002Fdiv>\n<h2 style=\"font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(2.4rem,5vw,4.6rem);line-height:.98;letter-spacing:-.03em;margin:20px 0 clamp(34px,4.5vw,54px);max-width:22ch\">Selected exhibition history of the AI Portraits series.<\u002Fh2>\n<div style=\"border-top:1px solid var(--rule)\">\n<sc-for list=\"{{ exhibitions }}\" as=\"row\" hint-placeholder-count=\"6\">\n<div style=\"display:flex;flex-wrap:wrap;gap:8px 28px;align-items:baseline;padding:17px 4px;border-bottom:1px solid var(--rule);transition:background .3s ease,padding-left .3s ease\" style-hover=\"background:rgba(255,255,255,.028);padding-left:14px\">\n<div style=\"flex:0 0 88px;font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)\">{{ row.year }}<\u002Fdiv>\n<div style=\"flex:1 1 320px;font-family:'Instrument Serif',Georgia,serif;font-size:1.4rem;line-height:1.2;letter-spacing:-.01em\">{{ row.place }}<\u002Fdiv>\n<div style=\"flex:1 1 240px;font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)\">{{ row.work }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n\n<footer style=\"border-top:1px solid var(--rule)\">\n<div style=\"width:min(calc(100% - 48px),1240px);margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;gap:22px;padding:28px 0 46px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.18em;font-size:.62rem;color:var(--muted)\">\n<span style=\"color:var(--paper)\">Pindar Van Arman<\u002Fspan>\n<span>AI Portraits · 2017–2024<\u002Fspan>\n<\u002Fdiv>\n<\u002Ffooter>\n\n\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#c08a55&quot;,&quot;options&quot;:[&quot;#c08a55&quot;,&quot;#b7b0a2&quot;,&quot;#8f9fae&quot;,&quot;#a8574a&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Palette&quot;},&quot;showHeroArtwork&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion &amp; layout&quot;},&quot;parallax&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion &amp; layout&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    this.applyProps();\n    this.setupMotion();\n  }\n\n  componentWillUnmount() {\n    if (this.io) this.io.disconnect();\n    if (this.onScroll) window.removeEventListener('scroll', this.onScroll);\n  }\n\n  applyProps() {\n    const accent = this.props.accent;\n    if (accent) document.documentElement.style.setProperty('--accent', accent);\n    const ghost = document.querySelector('[data-hero-art]');\n    if (ghost) ghost.style.display = this.props.showHeroArtwork === false ? 'none' : '';\n  }\n\n  setupMotion() {\n    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if (reduce || !('IntersectionObserver' in window)) return;\n\n    const nodes = Array.from(document.querySelectorAll('[data-reveal]'));\n    const ease = 'cubic-bezier(.22,.61,.36,1)';\n    nodes.forEach(n => {\n      n.style.opacity = '0';\n      n.style.transform = 'translateY(20px)';\n      n.style.transition = 'opacity .9s ' + ease + ', transform 1s ' + ease;\n    });\n    this.io = new IntersectionObserver(entries => {\n      entries.forEach(e => {\n        if (!e.isIntersecting) return;\n        const d = Number(e.target.dataset.delay || 0);\n        window.setTimeout(() => {\n          e.target.style.opacity = '1';\n          e.target.style.transform = 'none';\n        }, d);\n        this.io.unobserve(e.target);\n      });\n    }, { threshold: 0.1, rootMargin: '0px 0px -6% 0px' });\n    nodes.forEach(n => this.io.observe(n));\n\n    if (this.props.parallax === false) return;\n    const px = Array.from(document.querySelectorAll('[data-parallax]'));\n    if (!px.length) return;\n    let ticking = false;\n    const update = () => {\n      const vh = window.innerHeight;\n      px.forEach(el => {\n        const r = el.getBoundingClientRect();\n        if (r.bottom < -200 || r.top > vh + 200) return;\n        const c = (r.top + r.height / 2 - vh / 2) / vh;\n        el.style.transform = 'translate3d(0,' + (c * -22).toFixed(2) + 'px,0)';\n      });\n      ticking = false;\n    };\n    this.onScroll = () => {\n      if (ticking) return;\n      ticking = true;\n      window.requestAnimationFrame(update);\n    };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    update();\n  }\n\n  renderVals() {\n    return {\n      exhibitions: [\n        { year: '2018', place: 'MBN Y Forum, Seoul', work: 'Exhibition / presentation · Emerging Faces' },\n        { year: '2018', place: 'Aspen AI Conference, Berlin', work: 'Exhibition / presentation · Emerging Faces' },\n        { year: '2018', place: 'RobotArt, Tysons Corner Center, Virginia', work: 'Exhibition + First Prize · Emerging Faces' },\n        { year: '2018', place: 'VIEWS, during the Tribeca Film Festival, New York', work: 'Commission / presentation · First Sparks' },\n        { year: '2019', place: 'Art of the Machine, London', work: 'Group exhibition · Emerging Faces' },\n        { year: '2019', place: 'Beyond Species / Speciesism, New York', work: 'Group exhibition · Emerging Faces' },\n        { year: '2023', place: 'LACMA, Los Angeles', work: 'Permanent collection · Early AI Portraits' },\n        { year: '2023', place: 'Bright Moments Tokyo', work: 'Exhibition / commission / on-site mint · AI Imagined Faces On-Chain' },\n        { year: '2023', place: 'Bright Moments Spotlight, Venice Beach, Los Angeles', work: 'Exhibition / artist presentation · AI Imagined Faces On-Chain' },\n        { year: '2023', place: 'DEEEP, Miami', work: 'Exhibition · AI Portraits' },\n        { year: '2024', place: 'Sotheby’s Digital Art Day, New York', work: 'Auction / public presentation · AI Imagined Faces' },\n        { year: '2024', place: 'DEEEP, Paris', work: 'Exhibition · AI Portraits' },\n        { year: '2024', place: 'DEEEP, Shanghai', work: 'Exhibition · AI Portraits' },\n        { year: '2024–25', place: 'Art of Punk, Francisco Carolinum, Linz', work: 'Museum exhibition · Van Arman' },\n        { year: '2025', place: 'Christie’s Augmented Intelligence, New York', work: 'Auction + pre-sale exhibition · Emerging Faces' },\n        { year: '2025', place: 'Francisco Carolinum, Linz', work: 'Permanent collection · Reflection' },\n        { year: '2025', place: 'Museum of Art + Light, Manhattan, Kansas', work: 'Permanent collection · Reflection' },\n        { year: '2025', place: 'Lumen Prize', work: 'Finalist / recognition · Reflection' },\n        { year: '2025', place: 'Sotheby’s Contemporary Discoveries, New York', work: 'Auction / public presentation · Emerging Faces' },\n        { year: '2026', place: './spiral, presented by SuperRare · Fondazione Aversano, NYC', work: 'Exhibition · September 3–11 · Emergence to Reflection' }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
